<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f8df7"/>
      <stop offset="0.55" stop-color="#2f6ae0"/>
      <stop offset="1" stop-color="#172f78"/>
    </linearGradient>
    <radialGradient id="hl" cx="0.25" cy="0.15" r="0.75">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3d36b"/>
      <stop offset="1" stop-color="#c9a227"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#hl)"/>
  <rect x="1.5" y="1.5" width="509" height="509" rx="110.5" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="3"/>
  <g transform="translate(0 0) scale(1)" filter="url(#shadow)">
    <!-- briefcase handle -->
    <path d="M196 170 V142 a24 24 0 0 1 24 -24 h72 a24 24 0 0 1 24 24 V170" fill="none" stroke="#ffffff" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- briefcase body -->
    <rect x="104" y="170" width="304" height="212" rx="34" fill="#ffffff" fill-opacity="0.10" stroke="#ffffff" stroke-width="26" stroke-linejoin="round"/>
    <!-- flow bars -->
    <rect x="168" y="232" width="176" height="24" rx="12" fill="url(#gold)"/>
    <rect x="168" y="280" width="128" height="24" rx="12" fill="url(#gold)"/>
    <rect x="168" y="328" width="80" height="24" rx="12" fill="url(#gold)"/>
  </g>
</svg>